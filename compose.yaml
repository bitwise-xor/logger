services:
  db:
    image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    container_name: logger-v2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pgadmin
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD}
      CORE_RW_PASSWORD: ${CORE_RW_PASSWORD}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgadmin -d appdata"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  core:
    build: ./core
    image: logger-v2-core:pilot
    container_name: logger-v2-core
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD}
      CORE_RW_PASSWORD: ${CORE_RW_PASSWORD}
      MCP_PATH: ${MCP_PATH}
      ALLOWED_HOSTS: "log.19hospitalroad.fyi,logger-v2-core:*"  # the second: the hub's calls from another container (Host logger-v2-core:8000)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TODOIST_API_TOKEN: ${TODOIST_API_TOKEN}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}  # signs the nudges' notifications (webpush.py); made once, kept in .env
      WATCH_TOKEN: ${WATCH_TOKEN:-}  # the iPhone app's token for /watch/health (watch.py); typed by the owner into .env
      HUB_TOKEN: ${HUB_TOKEN:-}  # the hub's token for the MCP endpoint (auth.hub_access), 32 characters or more; empty = off
      FRONT_TOKEN: ${FRONT_TOKEN:-}  # the new front end's token for the JSON door /api/v1 (api.py), 32 characters or more; empty = the door is off
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal
      - proxy

  # The new front end at logger. (front/, docs/API.md): a small SvelteKit server that Caddy reaches on the proxy network and
  # that calls the core's JSON door at http://logger-v2-core:8000. It never touches the database. Deployed by
  # tools/deploy-front.sh (tools/deploy.sh builds the core only). Memory as the hub's: a limit with the same swap limit.
  front:
    build: ./front
    image: logger-v2-front:pilot
    container_name: logger-v2-front
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      ORIGIN: https://logger.19hospitalroad.fyi  # form posts from any other origin are refused
      DOOR_URL: http://logger-v2-core:8000
      FRONT_TOKEN: ${FRONT_TOKEN:-}  # the same token as the core's; empty = the door is off and the sign-in says so
      NODE_OPTIONS: --max-old-space-size=192
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Port 3000 for Caddy only (home network and tailnet). Nothing is published.
    networks:
      - proxy

networks:
  internal:
  proxy:
    external: true
