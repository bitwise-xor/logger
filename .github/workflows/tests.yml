name: tests

# The core's unit tests (no API key, no real data): a throwaway Postgres from tests/test-db.sh, then pytest.
# The private golden-message tests (tests/golden) are not in the repository and not part of this.
# Since 17.11.2026 it runs only when something it tests has changed: the core, the tests, the test database's start files,
# compose.yaml (tests/test_hubtools.py reads it) and the front end's sample answers (tests/test_front_samples.py checks them).
# A change to texts only (docs/, the idea lists) or to the front end alone starts no run here; the front end has its own
# workflow (front.yml).
on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "tests/**"
      - "db/**"
      - "compose.yaml"
      - "front/tests/samples/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "core/**"
      - "tests/**"
      - "db/**"
      - "compose.yaml"
      - "front/tests/samples/**"
      - ".github/workflows/tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install the pinned packages
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r core/requirements.txt pytest
      - name: Start the test database
        run: tests/test-db.sh up
      - name: Run the tests
        run: .venv/bin/python -m pytest -q tests
